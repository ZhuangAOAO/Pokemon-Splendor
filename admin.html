<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>账号审核 - 璀璨宝石宝可梦</title>
<style>
  *{ box-sizing:border-box; margin:0; padding:0; }
  [hidden]{ display:none !important; }
  body{ font-family:"YouYuan","幼圆","Microsoft YaHei","PingFang SC",sans-serif; background:linear-gradient(160deg,#eef4fb,#f8f4ec); color:#22303d; min-height:100vh; display:flex; align-items:center; justify-content:center; padding:20px; }
  .panel{ background:#fff; border-radius:20px; box-shadow:0 14px 40px rgba(34,48,61,.14); padding:28px 32px; width:520px; }
  h1{ font-size:22px; margin-bottom:14px; }
  h1 span{ color:#e3350d; }
  .row{ display:flex; gap:8px; margin-bottom:10px; }
  input{ flex:1; padding:9px 14px; border-radius:12px; border:2px solid #dde5ef; font-size:14px; font-family:inherit; background:#f5f8fc; }
  input:focus{ outline:none; border-color:#2f56c8; background:#fff; }
  .btn{ border:none; border-radius:12px; padding:10px 18px; font-size:14px; font-weight:800; cursor:pointer; font-family:inherit; }
  .btn.primary{ background:linear-gradient(180deg,#5b7ff0,#3b5fd0); color:#fff; }
  .btn.green{ background:linear-gradient(180deg,#34d399,#10b981); color:#fff; }
  .btn.red{ background:linear-gradient(180deg,#f87171,#dc2626); color:#fff; }
  .btn.ghost{ background:#fff; border:2px solid #dde5ef; }
  .stats{ display:flex; gap:8px; margin:12px 0; flex-wrap:wrap; }
  .stat{ background:#f5f8fc; border:1px solid #dde5ef; border-radius:10px; padding:6px 14px; font-size:13px; font-weight:700; }
  .item{ display:flex; align-items:center; gap:10px; background:#f5f8fc; border:1px solid #dde5ef; border-radius:12px; padding:10px 14px; margin-bottom:8px; }
  .item .name{ font-weight:900; flex:1; }
  .item .time{ font-size:12px; color:#93a2b3; }
  .empty{ color:#93a2b3; text-align:center; padding:16px; font-size:14px; }
  .section-title{ font-size:14px; font-weight:900; color:#5b6b7b; margin:16px 0 8px; border-top:2px dashed #dde5ef; padding-top:12px; }
  .section-title:first-of-type{ border-top:none; padding-top:0; }
  .hint{ color:#93a2b3; font-size:12px; text-align:center; margin-top:14px; }
</style>
</head>
<body>
<div class="panel">
  <div id="login-box">
    <h1>账号审核 · <span>璀璨宝石宝可梦</span></h1>
    <div class="row"><input id="ad-name" maxlength="12" placeholder="管理员用户名"></div>
    <div class="row"><input id="ad-pass" type="password" placeholder="密码"></div>
    <div class="row"><button id="ad-login" class="btn primary" style="flex:1">登录</button></div>
    <div class="hint">管理员账号用「初始化管理员.js」创建；普通玩家在游戏页面注册</div>
  </div>
  <div id="review-box" hidden>
    <h1>账号审核</h1>
    <div class="stats" id="stats"></div>
    <div class="section-title">待审核</div>
    <div id="pending-list"></div>
    <div class="section-title">已通过</div>
    <div id="approved-list"></div>
    <div class="section-title">已拒绝</div>
    <div id="denied-list"></div>
    <div class="row">
      <button id="ad-refresh" class="btn ghost" style="flex:1">刷新</button>
      <button id="ad-logout" class="btn ghost" style="flex:1">退出登录</button>
    </div>
  </div>
</div>
<script>
'use strict';
const $ = (s) => document.querySelector(s);
let token = localStorage.getItem('adToken') || '';
function toast(msg) {
  const t = document.createElement('div');
  t.textContent = msg;
  t.style.cssText = 'position:fixed;top:18px;left:50%;transform:translateX(-50%);background:#22303d;color:#fff;padding:10px 22px;border-radius:999px;font-size:14px;z-index:99;';
  document.body.appendChild(t);
  setTimeout(() => t.remove(), 2200);
}
async function api(body) {
  try {
    const r = await fetch('/api', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
    return r.json();
  } catch (e) {
    toast('无法连接服务器：请通过 http://服务器地址/admin.html 打开本页（不能直接双击文件）');
    return { ok: false };
  }
}
function rowHtml(u, actions) {
  return `
    <div class="item">
      <span class="name">${u.name}</span>
      <span class="time">${u.realName} · ${u.gradYear || '届数未填'}届 · ${u.createdAt}</span>
      ${actions}
    </div>`;
}
async function refresh() {
  const j = await api({ type: 'adminList', token });
  if (!j.ok) { toast(j.msg || '登录已过期'); showLogin(); return; }
  $('#stats').innerHTML = `
    <span class="stat">待审核 ${j.stats.pending}</span>
    <span class="stat">已通过 ${j.stats.approved}</span>
    <span class="stat">已拒绝 ${j.stats.denied}</span>`;
  const users = j.users || [];
  const pending = users.filter((u) => u.status === 'pending');
  const approved = users.filter((u) => u.status === 'approved');
  const denied = users.filter((u) => u.status === 'denied');
  $('#pending-list').innerHTML = pending.length
    ? pending.map((u) => rowHtml(u, `
        <button class="btn green" data-name="${u.name}" data-act="approve">通过</button>
        <button class="btn red" data-name="${u.name}" data-act="deny">拒绝</button>`)).join('')
    : '<div class="empty">没有待审核的申请</div>';
  $('#approved-list').innerHTML = approved.length
    ? approved.map((u) => rowHtml(u, `
        <button class="btn red" data-name="${u.name}" data-act="deny">撤销</button>`)).join('')
    : '<div class="empty">还没有已通过的账号</div>';
  $('#denied-list').innerHTML = denied.length
    ? denied.map((u) => rowHtml(u, `
        <button class="btn green" data-name="${u.name}" data-act="approve">重新通过</button>`)).join('')
    : '<div class="empty">没有已拒绝的申请</div>';
}
function showLogin() { $('#login-box').hidden = false; $('#review-box').hidden = true; }
function showReview() { $('#login-box').hidden = true; $('#review-box').hidden = false; refresh(); }
$('#ad-login').addEventListener('click', async () => {
  const j = await api({ type: 'login', name: $('#ad-name').value.trim(), password: $('#ad-pass').value });
  if (!j.ok) { toast(j.msg || '登录失败'); return; }
  if (j.role !== 'admin') { toast('该账号不是管理员'); return; }
  token = j.token;
  localStorage.setItem('adToken', token);
  showReview();
});
$('#ad-pass').addEventListener('keydown', (e) => { if (e.key === 'Enter') $('#ad-login').click(); });
['pending-list', 'approved-list', 'denied-list'].forEach((id) => {
  document.getElementById(id).addEventListener('click', async (e) => {
    const b = e.target.closest('button');
    if (!b || !b.dataset.name) return;
    const actText = b.dataset.act === 'approve' ? '通过' : '拒绝';
    if (!confirm('确定把 ' + b.dataset.name + ' 的状态改为「' + actText + '」吗？')) return;
    const j = await api({ type: 'adminReview', token, name: b.dataset.name, action: b.dataset.act });
    if (j.ok) toast('已处理：' + b.dataset.name);
    else toast(j.msg || '操作失败');
    refresh();
  });
});
$('#ad-refresh').addEventListener('click', refresh);
$('#ad-logout').addEventListener('click', () => { localStorage.removeItem('adToken'); token = ''; showLogin(); });
(async () => {
  if (!token) { showLogin(); return; }
  const j = await api({ type: 'whoami', token });
  if (j.ok && j.role === 'admin') showReview();
  else showLogin();
})();
</script>
</body>
</html>
